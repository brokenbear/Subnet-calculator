<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>單機版網段計算機</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 25px;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #3498db;
        }
        .result p {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .result span {
            font-weight: bold;
            color: #2c3e50;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>網段計算機 (Subnet Calculator)</h2>
        
        <div class="form-group">
            <label for="ip">IP 位址 (IP Address):</label>
            <input type="text" id="ip" value="192.168.1.1" placeholder="例如: 192.168.1.1">
        </div>
        
        <div class="form-group">
            <label for="cidr">子網路遮罩 (CIDR Prefix):</label>
            <select id="cidr"></select>
        </div>
        
        <button onclick="calculateSubnet()">計算 (Calculate)</button>

        <div id="resultBox"></div>
    </div>

    <script>
        // 初始化 CIDR 選單 (1 ~ 32)
        const cidrSelect = document.getElementById('cidr');
        for(let i = 1; i <= 32; i++) {
            let option = document.createElement('option');
            option.value = i;
            option.text = '/' + i;
            if(i === 24) option.selected = true; // 預設為 /24
            cidrSelect.appendChild(option);
        }

        // 將 IP 字串轉換為 32-bit 整數
        function ipToInt(ip) {
            return ip.split('.').reduce((int, octet) => (int << 8) + parseInt(octet, 10), 0) >>> 0;
        }

        // 將 32-bit 整數轉換回 IP 字串
        function intToIp(int) {
            return [
                (int >>> 24) & 255,
                (int >>> 16) & 255,
                (int >>> 8) & 255,
                int & 255
            ].join('.');
        }

        // 主要計算邏輯
        function calculateSubnet() {
            const ipInput = document.getElementById('ip').value.trim();
            const cidr = parseInt(document.getElementById('cidr').value, 10);
            const resultBox = document.getElementById('resultBox');

            // 驗證 IP 格式是否正確
            const ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            
            if (!ipRegex.test(ipInput)) {
                resultBox.innerHTML = '<p class="error">請輸入有效的 IPv4 位址！</p>';
                return;
            }

            const ipInt = ipToInt(ipInput);
            const maskInt = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
            
            // 計算網路位址與廣播位址
            const networkInt = (ipInt & maskInt) >>> 0;
            const broadcastInt = (networkInt | ~maskInt) >>> 0;

            let firstHostInt = networkInt + 1;
            let lastHostInt = broadcastInt - 1;
            let totalHosts = broadcastInt - networkInt - 1;

            // 處理 /31 和 /32 的特殊情況 (RFC 3021)
            if (cidr === 32) {
                firstHostInt = networkInt;
                lastHostInt = networkInt;
                totalHosts = 1;
            } else if (cidr === 31) {
                firstHostInt = networkInt;
                lastHostInt = broadcastInt;
                totalHosts = 2;
            }

            // 將結果轉換為字串
            const maskStr = intToIp(maskInt);
            const networkStr = intToIp(networkInt);
            const broadcastStr = intToIp(broadcastInt);
            const hostRangeStr = totalHosts > 0 ? `${intToIp(firstHostInt)} - ${intToIp(lastHostInt)}` : '無 (N/A)';

            // 顯示結果
            resultBox.innerHTML = `
                <div class="result">
                    <p>IP 位址: <span>${ipInput}</span></p>
                    <p>網路位址 (Network): <span>${networkStr}</span></p>
                    <p>子網路遮罩 (Subnet Mask): <span>${maskStr}</span></p>
                    <p>可用 IP 範圍 (Host Range): <br><span>${hostRangeStr}</span></p>
                    <p>廣播位址 (Broadcast): <span>${broadcastStr}</span></p>
                    <p>可用主機數量 (Usable Hosts): <span>${totalHosts.toLocaleString()}</span></p>
                </div>
            `;
        }

        // 預設載入時計算一次
        window.onload = calculateSubnet;
    </script>
</body>
</html>
